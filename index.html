<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>habit. — une semaine, une grille</title>
    <meta
      name="description"
      content="habit. répond à une seule question : qu'est-ce que j'ai tenu cette semaine ? Suivi d'habitudes local, hors ligne, sans compte."
    />
    <meta name="theme-color" content="#f2f3f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121311" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Aperçu de partage. og:url et og:image sont les deux seules lignes du
         dépôt qui dépendent du domaine : la spécification les veut absolues. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="habit." />
    <meta property="og:title" content="habit. — une semaine, une grille" />
    <meta
      property="og:description"
      content="Suivi d'habitudes local, hors ligne, sans compte. Sept colonnes, une ligne par habitude, un point quand c'est fait."
    />
    <meta property="og:url" content="https://habit.app/" />
    <meta property="og:image" content="https://habit.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="habit." />
    <meta property="og:locale" content="fr_FR" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Appliqué avant le premier rendu : évite le flash de thème clair.
      // Aucune requête, aucune dépendance — lecture locale seule.
      try {
        var raw = localStorage.getItem('habit.v1')
        var theme = raw ? (JSON.parse(raw).settings || {}).theme : null
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.setAttribute('data-theme', theme)
        }
      } catch (e) {
        /* stockage indisponible : le thème suit le système */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      habit. a besoin de JavaScript pour fonctionner. Tout s'exécute sur votre
      appareil : rien n'est envoyé nulle part.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
