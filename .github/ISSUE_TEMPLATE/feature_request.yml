name: Feature request
description: Something habit. should do and does not.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        habit. answers a single question: **what did I keep up this week?**
        Features that do not serve that question are refused on purpose,
        however good they are — streaks, percentages, scores, badges,
        reminders, goals and charts have all been considered and turned down.

        Streaks in particular. A streak turns a habit into a debt: you tick to
        keep the chain unbroken rather than for the habit itself, and the day
        the chain breaks you drop the lot. That refusal is not up for
        rediscussion, but everything else is.

        That is not a reason to stay quiet. It is a reason to answer the third
        field below carefully.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you were trying to do, and what got in the way. Not the solution yet.
      placeholder: |
        I track a habit that only makes sense on weekdays, and the weekend
        columns look like two failures every week.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like instead
      description: Be concrete. A sentence describing the screen is worth more than a feature name.
    validations:
      required: true

  - type: textarea
    id: fit
    attributes:
      label: How does this serve "what did I keep up this week?"
      description: >
        The filter every feature goes through. If the answer is that it would
        motivate you, measure you, or compare you against yourself or others,
        this is probably not the project for it — and that is fine.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
      description: Existing settings, the month view, archiving, export to a spreadsheet. What was missing.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues.
          required: true
        - label: I read "What it is not" in the README.
          required: true
        - label: This works without an account, a server, or a network request.
          required: true
        - label: This adds no streak, score, percentage or reward.
          required: true
